<h1>Es03C</h1>
<script>
    // Chiediamo il voto all'utente
    let voto = parseFloat(prompt("Inserisci il voto ottenuto (da 0 a 10):"));

    // Utilizzo dell'operatore ternario per l'esito
    let esito = (voto >= 6) ? "Promosso" : "Bocciato";

    // Controllo validità e Output
    if (isNaN(voto)) {
        console.log("Errore: inserisci un numero valido.");
    } else {
        console.log("Voto ottenuto: " + voto);
        console.log("Esito finale: " + esito);
    }
</script>
