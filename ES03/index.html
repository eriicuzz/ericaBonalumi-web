<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizi ES03</title>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --bg: #f8f9fa;
            --text: #2b2d42;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border: 2px solid #edf2f7;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            border-color: var(--primary);
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.15);
        }

        .card i {
            font-size: 2rem;
            margin-bottom: 15px;
            display: block;
        }

        .card span {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .card p {
            font-size: 0.85rem;
            color: #718096;
            margin-top: 10px;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ES03</h1>
    
    <div class="grid">
        <a href="esercizioA.html" class="card">
            <i>📦</i>
            <span>Es A</span>
            <p>Volume Scatola</p>
        </a>

        <a href="esercizioB.html" class="card">
            <i>📈</i>
            <span>Es B</span>
            <p>Analisi Retta</p>
        </a>

        <a href="esercizioC.html" class="card">
            <i>🎓</i>
            <span>Es C</span>
            <p>Esito Voto</p>
        </a>

        <a href="esercizioD.html" class="card">
            <i>🔍</i>
            <span>Es D</span>
            <p>Utilizzo Let/Var</p>
        </a>
    </div>
</div>

</body>
</html>
