<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Erica Bonalumi</title>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #1a1c20;
            --accent: #4cc9f0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 900px;
        }

        h1 { font-size: 2.2rem; color: var(--primary); margin: 0; }
        .info-student { color: #555; font-size: 1.1rem; margin-top: 10px; font-weight: 500; }

        .section-title {
            width: 100%;
            max-width: 900px;
            text-align: left;
            margin: 30px 0 15px 0;
            font-size: 1.5rem;
            color: var(--secondary);
            border-left: 5px solid var(--accent);
            padding-left: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid transparent;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(67, 97, 238, 0.15);
            border-color: var(--primary);
        }

        .icon { font-size: 2.5rem; margin-bottom: 10px; }
        .card h3 { margin: 10px 0 5px 0; font-size: 1.1rem; color: var(--primary); }
        .card p { margin: 0; font-size: 0.85rem; color: #777; text-align: center; }

        footer {
            margin-top: 50px;
            padding: 20px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Erica Bonalumi</h1>
        <div class="info-student">Classe 4^CI • A.S. 2025/2026</div>
    </div>

    <div class="section-title">Esercitazione ES02</div>
    <div class="grid">
        <a href="ES02/index.html" class="card">
            <div class="icon">📁</div>
            <h3>Esercizio 02</h3>
            <p>Base JavaScript</p>
        </a>
    </div>

    <div class="section-title">Esercitazione ES03</div>
    <div class="grid">
        <a href="ES03/esercizioA.html" class="card">
            <div class="icon">📦</div>
            <h3>Esercizio 3A</h3>
            <p>Calcolo Volume Scatola</p>
        </a>

        <a href="ES03/esercizioB.html" class="card">
            <div class="icon">📈</div>
            <h3>Esercizio 3B</h3>
            <p>Analisi della Retta</p>
        </a>

        <a href="ES03/esercizioC.html" class="card">
            <div class="icon">🎓</div>
            <h3>Esercizio 3C</h3>
            <p>Esito Voto</p>
        </a>

        <a href="ES03/esercizioD.html" class="card">
            <div class="icon">🔑</div>
            <h3>Esercizio 3D</h3>
            <p>Let vs Var</p>
        </a>
    </div>

</body>
</html>
