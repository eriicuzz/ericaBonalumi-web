<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatrice Avanzata HTML</title>
    <style>
        body { font-family: monospace; line-height: 1.5; padding: 20px; background-color: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; }
        #result { 
            white-space: pre; 
            background: #222; 
            color: #2ecc71; 
            padding: 15px; 
            margin-top: 20px; 
            border-radius: 5px; 
            display: none; 
        }
        input, button { margin: 5px 0; padding: 8px; }
        .error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🧮 Calcolatrice</h1>

    <form id="calculatorForm" onsubmit="calcola(); return false;">
        <label>Primo numero:</label><br>
        <input type="number" id="num1" step="any" required><br>
        
        <label>Operazione (add, sot, mult, div o +, -, *, /):</label><br>
        <input type="text" id="operation" placeholder="es. add o *" required><br>
        
        <label>Secondo numero:</label><br>
        <input type="number" id="num2" step="any" required><br>
        
        <button type="submit" style="background: #3498db; color: white; border: none; cursor: pointer; width: 100%;">ESEGUI CALCOLO</button>
    </form>

    <div id="result"></div>
</div>

<script>
    function calcola() {
        // 1. Acquisizione input (come facevi con process.argv)
        const n1 = parseFloat(document.getElementById('num1').value);
        const operazione = document.getElementById('operation').value.trim().toLowerCase();
        const n2 = parseFloat(document.getElementById('num2').value);
        const resultDiv = document.getElementById('result');

        // Reset e validazione numeri
        resultDiv.style.display = "block";
        if (isNaN(n1) || isNaN(n2)) {
            resultDiv.innerHTML = '<span class="error">❌ Errore: Inserisci numeri validi!</span>';
            return;
        }

        let risultato;
        let simbolo;

        // 2. Logica di calcolo (il tuo Switch Case)
        switch (operazione) {
            case 'add':
            case '+':
                risultato = n1 + n2;
                simbolo = '+';
                break;
            case 'sot':
            case '-':
                risultato = n1 - n2;
                simbolo = '-';
                break;
            case 'mult':
            case '*':
                risultato = n1 * n2;
                simbolo = 'x';
                break;
            case 'div':
            case '/':
                if (n2 !== 0) {
                    risultato = n1 / n2;
                } else {
                    risultato = "Errore (Divisione per zero)";
                }
                simbolo = '÷';
                break;
            default:
                risultato = "Operazione non valida";
                simbolo = '?';
        }

        // 3. Formattazione output stile Console/Terminale
        const separator = '='.repeat(40);
        const dataLocale = new Date().toLocaleDateString('it-IT');
        const oraLocale = new Date().toLocaleTimeString('it-IT');
        
        // Costruiamo la stringa finale
        let output = `${separator}\n`;
        output += `🧮 Operazione: ${n1} ${simbolo} ${n2}\n`;
        output += `✅ Risultato:  ${risultato}\n`;
        output += `${separator}\n\n`;
        output += `📅 Data: ${dataLocale}\n`;
        output += `⏰ Ora: ${oraLocale}\n`;
        output += `🌐 Browser: ${navigator.userAgent.split(' ').pop()}\n`; // Sostituisce la versione di Node
        output += `🖥️ Piattaforma: ${navigator.platform}`;

        resultDiv.textContent = output;
    }
</script>

</body>
</html>
