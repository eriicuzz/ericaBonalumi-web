<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolatrice Semplice</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f0f0; }
        .container { background: white; padding: 20px; border-radius: 10px; max-width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        #result { 
            margin-top: 20px; 
            padding: 15px; 
            background: #eef; 
            border-left: 5px solid #3498db; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧮 Calcolatrice</h1>

    <label>Primo numero:</label>
    <input type="number" id="num1">

    <label>Operatore (+, -, *, /):</label>
    <input type="text" id="operator" placeholder="Inserisci l'operatore">

    <label>Secondo numero:</label>
    <input type="number" id="num2">

    <button onclick="calcola()">ESEGUI CALCOLO</button>

    <div id="result">Il risultato apparirà qui</div>
</div>

<script>
    function calcola() {
        // 1. Recuperiamo i valori dai campi di input (come facevamo con process.argv)
        const n1 = Number(document.getElementById('num1').value);
        const op = document.getElementById('operator').value;
        const n2 = Number(document.getElementById('num2').value);
        const display = document.getElementById('result');

        let risultato;

        // 2. Logica di calcolo identica alla versione Node.js
        switch (op) {
            case '+':
                risultato = n1 + n2;
                break;
            case '-':
                risultato = n1 - n2;
                break;
            case '*':
                risultato = n1 * n2;
                break;
            case '/':
                if (n2 === 0) {
                    risultato = "Errore: divisione per zero!";
                } else {
                    risultato = n1 / n2;
                }
                break;
            default:
                risultato = "Operatore non valido!";
        }

        // 3. Mostriamo il risultato nella pagina
        display.innerHTML = "Risultato: " + risultato;
    }
</script>

</body>
</html>
