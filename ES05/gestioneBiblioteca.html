<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercitazione Biblioteca - Erica Bonalumi</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            background-color: #f0f2f5;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; }
        h2 { color: #5f6368; margin-top: 25px; }
        .output-box {
            background: #202124;
            color: #e8eaed;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            margin-top: 10px;
        }
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #e8f0fe;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .stat-item b { color: #1a73e8; }
    </style>
</head>
<body>

<div class="container">
    <h1>Esercitazione 1: Biblioteca di Libri</h1>
    
    <h2>Log Operazioni (Console)</h2>
    <div id="log-output" class="output-box"></div>

    <h2>Riepilogo Statistiche</h2>
    <div id="stats-output" class="stats-container"></div>

    <h2>Catalogo Completo</h2>
    <div id="catalogo-output" class="output-box"></div>
</div>

<script>
    // Funzione per scrivere i log sulla pagina invece che solo in console
    const logDiv = document.getElementById('log-output');
    function logToPage(text) {
        logDiv.innerHTML += text + "\n";
    }

    // --- INIZIO LOGICA JAVASCRIPT ---

    logToPage("=== AVVIO SISTEMA BIBLIOTECA ===");

    // 1. Creazione Oggetti
    const libro1 = {
        titolo: "Il Signore degli Anelli",
        autore: "J.R.R. Tolkien",
        anno: 1954,
        genere: "Fantasy",
        pagine: 1178,
        disponibile: true
    };

    const libro2 = {
        titolo: "1984",
        autore: "George Orwell",
        anno: 1949,
        genere: "Distopia",
        pagine: 328,
        disponibile: false
    };

    // 2. Accesso e Modifica
    libro2.disponibile = true; // Qualcuno ha restituito il libro
    libro1.isbn = "978-0544003415";

    // 3. Metodi
    const libro3 = {
        titolo: "Il Nome della Rosa",
        autore: "Umberto Eco",
        anno: 1980,
        pagine: 503,
        disponibile: true,
        getInfo: function() {
            return `${this.titolo} di ${this.autore} (${this.anno})`;
        },
        presta: function() {
            if (this.disponibile) {
                this.disponibile = false;
                logToPage(`OPERAZIONE: Prestato "${this.titolo}"`);
            } else {
                logToPage(`ERRORE: "${this.titolo}" non è disponibile`);
            }
        }
    };

    // Esecuzione test metodi
    logToPage("Info Libro 3: " + libro3.getInfo());
    libro3.presta();

    // 4. Array di Oggetti
    const biblioteca = [libro1, libro2, libro3];

    // 5. Statistiche
    function calcolaStatistiche(libri) {
        const totaleLibri = libri.length;
        const disponibili = libri.filter(l => l.disponibile).length;
        const totalePagine = libri.reduce((acc, l) => acc + l.pagine, 0);
        const mediaPagine = Math.round(totalePagine / totaleLibri);
        const autori = [...new Set(libri.map(l => l.autore))];

        return { totaleLibri, disponibili, totalePagine, mediaPagine, autori };
    }

    // --- VISUALIZZAZIONE RISULTATI ---

    const stats = calcolaStatistiche(biblioteca);
    const statsDiv = document.getElementById('stats-output');
    statsDiv.innerHTML = `
        <div class="stat-item">Totale Libri: <b>${stats.totaleLibri}</b></div>
        <div class="stat-item">Disponibili: <b>${stats.disponibili}</b></div>
        <div class="stat-item">Pagine Totali: <b>${stats.totalePagine}</b></div>
        <div class="stat-item">Media Pagine: <b>${stats.mediaPagine}</b></div>
        <div class="stat-item" style="grid-column: span 2;">Autori: <i>${stats.autori.join(", ")}</i></div>
    `;

    const catalogoDiv = document.getElementById('catalogo-output');
    biblioteca.forEach(l => {
        catalogoDiv.innerHTML += `Titolo: ${l.titolo}\nAutore: ${l.autore}\nStato: ${l.disponibile ? "DISPONIBILE" : "NON DISPONIBILE"}\n---\n`;
    });

    logToPage("=== OPERAZIONI COMPLETATE ===");
</script>

</body>
</html>
