<!DOCTYPE html>
<html>
<head>
    <title>Biblioteca Semplice</title>
</head>
<body>

    <h1>Esercitazione Biblioteca</h1>

    <h3>Operazioni effettuate:</h3>
    <div id="operazioni"></div>

    <h3>Dati riassuntivi:</h3>
    <div id="statistiche"></div>

    <h3>Elenco Libri:</h3>
    <ul id="lista-libri"></ul>

    <script>
        // 1. Creazione dei libri (Oggetti)
        const libro1 = { titolo: "Il Signore degli Anelli", autore: "J.R.R. Tolkien", pagine: 1100, disponibile: true };
        const libro2 = { titolo: "1984", autore: "George Orwell", pagine: 300, disponibile: true };
        const libro3 = { titolo: "Il Nome della Rosa", autore: "Umberto Eco", pagine: 500, disponibile: true };

        // 2. Operazione semplice: prestiamo un libro
        libro3.disponibile = false;
        document.getElementById("operazioni").innerHTML = "Hai prestato: " + libro3.titolo;

        // 3. Array della biblioteca
        const biblioteca = [libro1, libro2, libro3];

        // 4. Calcoli semplici (Statistiche)
        let totalePagine = libro1.pagine + libro2.pagine + libro3.pagine;
        let mediaPagine = Math.round(totalePagine / biblioteca.length);

        document.getElementById("statistiche").innerHTML = 
            "Libri totali: " + biblioteca.length + "<br>" +
            "Media pagine: " + mediaPagine;

        // 5. Ciclo per stampare la lista nel browser
        const listaUI = document.getElementById("lista-libri");
        
        biblioteca.forEach(function(libro) {
            let stato = libro.disponibile ? "Disponibile" : "Non disponibile";
            listaUI.innerHTML += "<li>" + libro.titolo + " (" + libro.autore + ") - <b>" + stato + "</b></li>";
        });
    </script>

</body>
</html>
