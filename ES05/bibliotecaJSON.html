<!DOCTYPE html>
<html>
<head>
    <title>Esercizio 04 - JSON</title>
</head>
<body>

    <h1>Esercitazione 04: JSON e Biblioteca</h1>
    
    <div id="spazio-testo"></div>

    <script>
        // Funzione per scrivere sulla pagina in modo semplice
        const area = document.getElementById('spazio-testo');
        function scrivi(testo) {
            area.innerHTML += testo + "<br><br>";
        }

        // --- DATI DI PARTENZA ---
        const libroDati = { titolo: "Il Nome della Rosa", autore: "Umberto Eco", anno: 1980 };
        const stringaDaLeggere = '{"titolo":"Don Chisciotte","autore":"Cervantes","anno":1605}';
        const utente = { nome: "Mario", psw: "segreto123" };

        // --- 1. TRASFORMARE IN JSON (Stringify) ---
        // Creiamo il JSON escludendo la password per sicurezza
        const utenteInTesto = JSON.stringify(utente, (chiave, valore) => {
            if (chiave === "psw") return undefined;
            return valore;
        });
        scrivi("1. Utente convertito in testo (senza password): " + utenteInTesto);

        // --- 2. LEGGERE UN JSON (Parse) ---
        const libroOggetto = JSON.parse(stringaDaLeggere);
        scrivi("2. Titolo del libro letto dal JSON: " + libroOggetto.titolo);

        // --- 3. GESTIONE ERRORI ---
        try {
            JSON.parse('{"errore": }'); // JSON scritto male apposta
        } catch (errore) {
            scrivi("3. Errore catturato: il JSON non era scritto bene.");
        }

        // --- 4. CLASSE BIBLIOTECA ---
        class Biblioteca {
            constructor() {
                this.lista = [];
            }
            aggiungi(titoloLibro, numPagine) {
                this.lista.push({ titolo: titoloLibro, pagine: numPagine });
            }
            contaLibri() {
                return this.lista.length;
            }
        }

        // Creiamo la biblioteca e aggiungiamo un libro
        const miaBiblio = new Biblioteca();
        miaBiblio.aggiungi("Inferno", 400);

        scrivi("4. Numero libri in biblioteca: " + miaBiblio.contaLibri());

    </script>

</body>
</html>
